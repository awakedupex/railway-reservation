services:
  - type: web
    name: railway-reservation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railway-db
          property: connectionString

databases:
  - name: railway-db
    databaseName: railway
    plan: free
